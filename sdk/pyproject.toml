[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infera-sdk"
version = "0.1.0"
description = "Python Telemetry & Tracing SDK for Infera AI Agent Observability Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["infera_sdk"]
